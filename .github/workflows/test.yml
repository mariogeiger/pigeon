# Every push and pull request runs the workspace's tests on Linux, macOS
# and Windows, the systems pigeon runs on, and on Linux the commit hooks
# themselves over every file, all with the Rust rust-toolchain.toml names,
# so that the checks are defined once.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: pipx run pre-commit run --all-files --show-diff-on-failure
      - run: cargo test --workspace --locked --no-fail-fast
