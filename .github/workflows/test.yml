# Every push and pull request runs the workspace's tests on Linux, macOS
# and Windows, the systems pigeon runs on, and on Linux the checks the
# commit hooks make: file length and header, formatting, and clippy.

name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: python3 scripts/check-file-length-and-header
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::pedantic
      - run: cargo test --workspace --locked
