[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mariogeiger/pigeon"
rust-version = "1.91"

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
pigeon-store = { path = "crates/pigeon-store" }
pigeon-net = { path = "crates/pigeon-net" }
pigeon-sync = { path = "crates/pigeon-sync" }
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart"] }
clap = "4.6.7"
clap_complete = "4.6.11"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
dirs = "6"
argon2 = "0.5"
blake3 = "1"
data-encoding = "2.11"
getrandom = "0.4"
ignore = "0.4.33"
iroh = "1.3"
iroh-blobs = "0.103"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
notify = "8.2"
maud = "0.27"
similar = "3.2"
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
postcard = { version = "1", features = ["use-std"] }
redb = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
uhlc = "0.9"
unicode-normalization = "0.1"
ureq = { version = "3.4", default-features = false, features = ["json"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
