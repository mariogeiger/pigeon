[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mariogeiger/pigeon"
rust-version = "1.90"

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
pigeon-store = { path = "crates/pigeon-store" }
argon2 = "0.5"
blake3 = "1"
data-encoding = "2.11"
getrandom = "0.4"
ignore = "0.4.33"
iroh-blobs = "0.103"
iroh-base = { version = "1.3", default-features = false, features = ["key"] }
postcard = { version = "1", features = ["use-std"] }
redb = "4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
uhlc = "0.9"
unicode-normalization = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
